name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dependabot squash-merges should move nightly, not latest (keep latest = intentional main tip / release).
      - name: Image channel
        id: channel
        run: |
          set -euo pipefail
          MSG="$(git log -1 --pretty=%B)"
          AUTHOR="$(git log -1 --pretty='%an <%ae>')"
          echo "head_subject=$(git log -1 --pretty=%s)"
          LATEST=true
          CHANNEL=main
          if echo "$MSG$AUTHOR" | grep -qiE 'dependabot|chore\(deps\)|^Bump '; then
            LATEST=false
            CHANNEL=dependabot
          fi
          # Tag pushes always refresh latest + semver.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            LATEST=true
            CHANNEL=release
          fi
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL} latest=${LATEST}"

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/potato-network
          labels: |
            org.opencontainers.image.title=PotatoNetwork
            pn.image.channel=${{ steps.channel.outputs.channel }}
          tags: |
            type=raw,value=nightly,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ steps.channel.outputs.latest == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Tag-only: static Linux binaries + GitHub Release (notes since previous tag).
  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          NAME="potatonetwork_${VERSION}_${GOOS}_${GOARCH}"
          go build -trimpath -ldflags="-s -w" -o "${NAME}" ./cmd/potatonetwork
          sha256sum "${NAME}" | tee "${NAME}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: potatonetwork-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            potatonetwork_*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: potatonetwork-*
          merge-multiple: true
      - name: List assets
        run: ls -la dist/
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
